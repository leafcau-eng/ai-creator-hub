name: Video Trim

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'video_jobs.id (UUID)'
        required: true
      asset_path:
        description: 'Storage path dari source asset (misal: assets/user_id/video.mp4)'
        required: true
      start_time:
        description: 'Start time dalam detik (misal: 10.5)'
        required: true
      end_time:
        description: 'End time dalam detik (misal: 45.0)'
        required: true

jobs:
  trim:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-ffmpeg
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install supabase requests

      - name: Run Video Trim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python video_trim.py \
            "${{ github.event.inputs.job_id }}" \
            "${{ github.event.inputs.asset_path }}" \
            "${{ github.event.inputs.start_time }}" \
            "${{ github.event.inputs.end_time }}"
